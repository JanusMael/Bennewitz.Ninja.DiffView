name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The sibling feed (../nuget-local) holds packages built from the author's other
      # repositories. The reference fetch clones ClaudeForge at its pin when no sibling
      # checkout exists, and the pack script builds the diagnostics package from it.
      - name: Fetch reference sources
        run: dotnet run scripts/fetch-reference.cs

      - name: Pack ClaudeForge diagnostics into the local feed
        run: dotnet run scripts/pack-diagnostics.cs

      - name: Restore
        run: dotnet restore DiffView.slnx

      - name: Build (Debug)
        run: dotnet build DiffView.slnx --no-restore -c Debug -warnaserror

      # Microsoft.Testing.Platform mode (global.json "test.runner"); trx from the TrxReport extension.
      - name: Test
        run: >
          dotnet test --solution DiffView.slnx
          --no-build -c Debug
          --report-trx
          --results-directory ./test-results

      # ⚠ Away from Linux the image baselines are filtered out (LinuxBaselineAttribute,
      # tests/Directory.Build.props): they were rendered and reviewed on Linux, and another platform's
      # rasterization differs without anything being wrong. A filter is silent in the test summary —
      # tests that quietly vanish read as tests that passed — so this says how many were left out,
      # and which.
      - name: Linux-only baselines left out here
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: >
          dotnet test --solution DiffView.slnx
          --no-build -c Debug --list-tests
          -p:ExcludeLinuxBaselines=false
          --filter-trait Baseline=Linux

      # ⛔ The mutation harness's standing half. A guard marked inert-at-pin is excused only at the
      # version it was measured against, so a pin bump is exactly the change that lands green while
      # that guard stops being excused; this fails on that, and on a `throw` in a gate file, which the
      # harness cannot attribute a failure to. It proves no guard — a full run does that, and one is
      # owed after any change to a gate file, a gated subject or a pin (AGENTS.md §5). One OS, because
      # it reads files; !cancelled() so a red test step does not hide it.
      - name: Mutation-harness guards
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: dotnet run scripts/mutate-gates.cs -- --guards

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results/*.trx
          retention-days: 14

      # ⭐ The step that turns a red CI run into evidence. Two of this repository's gates write a
      # "received" file beside the committed one they disagree with — the theme audit's regenerated
      # report, and every Verify image snapshot — and CI then throws the runner away. The failure
      # message names a file nobody outside the runner can read, which is why defect A of plan 00024
      # went three days with three dead hypotheses and no diff to look at.
      #
      # ⚠ if: failure() rather than always(): on a green run these paths do not exist, and an
      # upload-artifact step with no matching path warns. Uploading nothing, loudly, on every
      # successful run is how a step gets deleted by whoever is tidying next.
      - name: Upload what the gates rejected
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received-${{ matrix.os }}
          path: |
            docs/*.received.md
            tests/**/*.received.*
          if-no-files-found: ignore
          retention-days: 14

  culture-leg:
    name: Culture Leg (de-DE)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch reference sources
        run: dotnet run scripts/fetch-reference.cs

      - name: Pack ClaudeForge diagnostics into the local feed
        run: dotnet run scripts/pack-diagnostics.cs

      - name: Restore
        run: dotnet restore DiffView.slnx

      - name: Build (Debug)
        run: dotnet build DiffView.slnx --no-restore -c Debug -warnaserror

      # The audit, not a second platform. The suite runs pinned to a culture the library
      # ships, and a failure here that is green everywhere else means one thing: a test
      # asserted English text without saying it wanted English — invisible on an English
      # runner, red on a German desk. One OS, because the axis under test is the culture.
      #
      # Tests that are genuinely about English words say so with [EnglishChrome] and are out
      # of this leg's reach by construction; that set is the set plan 00015 measured, and a
      # test added without it is in the leg by default, which is the way round it should be.
      - name: Test (DIFFVIEW_TEST_UI_CULTURE=de-DE)
        env:
          DIFFVIEW_TEST_UI_CULTURE: de-DE
        run: >
          dotnet test --solution DiffView.slnx
          --no-build -c Debug
          --report-trx
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-culture-de-DE
          path: ./test-results/*.trx
          retention-days: 14

      # ⭐ The step that turns a red CI run into evidence. Two of this repository's gates write a
      # "received" file beside the committed one they disagree with — the theme audit's regenerated
      # report, and every Verify image snapshot — and CI then throws the runner away. The failure
      # message names a file nobody outside the runner can read, which is why defect A of plan 00024
      # went three days with three dead hypotheses and no diff to look at.
      #
      # ⚠ if: failure() rather than always(): on a green run these paths do not exist, and an
      # upload-artifact step with no matching path warns. Uploading nothing, loudly, on every
      # successful run is how a step gets deleted by whoever is tidying next.
      - name: Upload what the gates rejected
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received-culture-de-DE
          path: |
            docs/*.received.md
            tests/**/*.received.*
          if-no-files-found: ignore
          retention-days: 14

  trim-check:
    name: Trim Check (Release linux-x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch reference sources
        run: dotnet run scripts/fetch-reference.cs

      - name: Pack ClaudeForge diagnostics into the local feed
        run: dotnet run scripts/pack-diagnostics.cs

      # The first intended host publishes trimmed; a new IL2xxx here is fixed or
      # suppressed with a DECISIONS.md entry, never ignored.
      - name: Publish (Release, linux-x64, trimmed)
        run: >
          dotnet publish src/DiffView.Demo
          -c Release -r linux-x64
          --self-contained true
          -o /tmp/trim-check
